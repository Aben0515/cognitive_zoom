# Opt-in Cognitive Zoom filesystem Skill provider for DeepSeek Harness.
# Resolves the packaged Skill root from the installed npm identity anchored at
# the DSH profile (Loader baseUrl), never as a path concatenated onto baseUrl.
- insert:
    - id: cognitive-zoom-skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: cognitive-zoom-plugin
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('cognitive-zoom-dsh/package.json')), 'skills')
    - id: cognitive-zoom-client
      name: cognitive-zoom-dsh
